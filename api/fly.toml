# fly.toml app configuration file generated for as-api on 2025-02-11T16:07:15+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'as-api'
primary_region = 'lhr'

[build]

[deploy]
  release_command = "/migrate postgres dir up"

[http_service]
  internal_port = 3001
  force_https = false
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 350
    soft_limit = 300

  [[http_service.checks]]
    interval = '5s'
    timeout = '10s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

  [http_service.http_options]
    h2_backend = false
    idle_timeout = 600

    [http_service.http_options.response]
      pristine = true

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
