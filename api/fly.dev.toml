# fly.toml app configuration file generated for dev-as-api on 2025-02-11T16:43:28+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dev-as-api'
primary_region = 'lhr'

[build]

[deploy]
  release_command = '/migrate postgres dir up'

[http_service]
  internal_port = 3001
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 350
    soft_limit = 300

  [http_service.http_options]
    h2_backend = false
    idle_timeout = 600

    [http_service.http_options.response]
      pristine = true

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
