services:
  db:
    image: postgres:16.3-bookworm
    restart: always
    hostname: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
  cache:
    image: redis/redis-stack
    restart: always
    hostname: cache
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
  email:
    image: mailhog/mailhog
    restart: always

volumes:
  redis_data:
  pg_data:
